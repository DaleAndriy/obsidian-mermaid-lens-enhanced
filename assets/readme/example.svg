<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 232.10000000000002" width="210" height="232.10000000000002" style="--bg:#FFFFFF;--fg:#1769AA;--line:#A6ADB4;--accent:#1769AA;--muted:#3978A8;--surface:#E7F3FC;--border:#D4E3EE;background:var(--bg)" id="readme-en-readme-example-en" data-layout-refined="true" role="img"><title>A decision with two clearly separated branches</title>
<style>

  #readme-en-readme-example-en text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #readme-en-readme-example-en {
